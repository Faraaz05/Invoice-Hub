<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceHub - Test Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 1.1rem;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #e1e8ed;
            border-radius: 6px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        input[type="file"]:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-right: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .token-display {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
        }
        
        .file-info {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .file-info h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }
        
        .extraction-info {
            background: #f3e5f5;
            border: 1px solid #e1bee7;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .extraction-info h3 {
            color: #7b1fa2;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 InvoiceHub</h1>
            <p>Test Invoice Upload & OCR Extraction</p>
        </div>
        
        <div class="content">
            <!-- Login Section -->
            <div class="section">
                <h2>🔐 Step 1: Login</h2>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" value="clerk@invoicehub.com" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" value="password123" placeholder="Enter password">
                </div>
                <button onclick="login()">Login</button>
                <div id="loginResult"></div>
            </div>
            
            <!-- Upload Section -->
            <div class="section">
                <h2>📁 Step 2: Upload Invoice</h2>
                <div class="form-group">
                    <label for="invoiceFile">Select Invoice File (PDF or Image):</label>
                    <input type="file" id="invoiceFile" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.tif">
                </div>
                <button onclick="uploadInvoice()" id="uploadBtn" disabled>Upload Invoice</button>
                <div id="uploadResult"></div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        const API_BASE = 'http://localhost:5000/api';
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            if (!email || !password) {
                resultDiv.innerHTML = '<div class="result error">Please enter email and password</div>';
                return;
            }
            
            try {
                resultDiv.innerHTML = '<div class="result info">Logging in...</div>';
                
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    authToken = data.data.token;
                    document.getElementById('uploadBtn').disabled = false;
                    
                    resultDiv.innerHTML = `
                        <div class="result success">✅ Login successful!
User: ${data.data.name} (${data.data.role})
Email: ${data.data.email}</div>
                        <div class="token-display">Token: ${authToken.substring(0, 50)}...</div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Login failed: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Network error: ${error.message}</div>`;
            }
        }
        
        async function uploadInvoice() {
            const fileInput = document.getElementById('invoiceFile');
            const resultDiv = document.getElementById('uploadResult');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (!authToken) {
                resultDiv.innerHTML = '<div class="result error">Please login first</div>';
                return;
            }
            
            if (!fileInput.files[0]) {
                resultDiv.innerHTML = '<div class="result error">Please select a file</div>';
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('invoice', file);
            
            try {
                uploadBtn.disabled = true;
                uploadBtn.textContent = 'Uploading & Processing...';
                resultDiv.innerHTML = '<div class="result info">📤 Uploading file and extracting text...</div>';
                
                const response = await fetch(`${API_BASE}/invoices/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    const invoice = data.data.invoice;
                    const fileInfo = data.data.file;
                    const extraction = data.data.extraction;
                    
                    resultDiv.innerHTML = `
                        <div class="result success">✅ Invoice uploaded and processed successfully!</div>
                        
                        <div class="file-info">
                            <h3>📁 File Information</h3>
                            <strong>Original Name:</strong> ${fileInfo.originalName}<br>
                            <strong>File Size:</strong> ${(fileInfo.size / 1024).toFixed(2)} KB<br>
                            <strong>MIME Type:</strong> ${fileInfo.mimeType}<br>
                            <strong>Stored As:</strong> ${fileInfo.fileName}
                        </div>
                        
                        <div class="extraction-info">
                            <h3>🔍 OCR Extraction Results</h3>
                            <strong>Method:</strong> ${extraction.method}<br>
                            <strong>Text Length:</strong> ${extraction.textLength} characters<br>
                            <strong>Keywords Found:</strong> ${extraction.validation.foundKeywords.join(', ')}<br>
                            <strong>Confidence:</strong> ${extraction.validation.confidence.toFixed(1)}%<br>
                            ${extraction.metadata.confidence ? `<strong>OCR Confidence:</strong> ${extraction.metadata.confidence.toFixed(1)}%<br>` : ''}
                        </div>
                        
                        <div class="result info">
                            <strong>📋 Invoice Details:</strong><br>
                            ID: ${invoice._id}<br>
                            Number: ${invoice.invoiceNumber}<br>
                            Status: ${invoice.status}<br>
                            Created: ${new Date(invoice.createdAt).toLocaleString()}<br>
                            <br>
                            <strong>📄 View Original Invoice:</strong><br>
                            <button onclick="viewInvoiceFile('${invoice._id}')" 
                                    style="background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                               🔗 Open Original Invoice File
                            </button><br>
                            <small style="color: #666;">Click to view the original uploaded file (PDF/Image)</small>
                        </div>
                        
                        <div class="result info">
                            <strong>📝 Extracted Text Preview:</strong><br>
                            ${invoice.rawText.substring(0, 500)}${invoice.rawText.length > 500 ? '...' : ''}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Upload failed: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Network error: ${error.message}</div>`;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Invoice';
            }
        }
        
        // Handle file selection
        document.getElementById('invoiceFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const resultDiv = document.getElementById('uploadResult');
                resultDiv.innerHTML = `
                    <div class="result info">📎 Selected: ${file.name} (${(file.size / 1024).toFixed(2)} KB)
File type: ${file.type || 'Unknown'}
Ready to upload!</div>
                `;
            }
        });
        
        // Function to view invoice file with authentication
        async function viewInvoiceFile(invoiceId) {
            if (!authToken) {
                alert('Please login first');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/invoices/${invoiceId}/file`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    // Get the content type to determine how to display
                    const contentType = response.headers.get('content-type');
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    // Open in new tab
                    window.open(url, '_blank');
                    
                    // Clean up the URL after a delay
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                } else {
                    const errorData = await response.json();
                    alert(`Error viewing file: ${errorData.message}`);
                }
            } catch (error) {
                alert(`Network error: ${error.message}`);
            }
        }
        
        // Auto-login for testing
        window.addEventListener('load', function() {
            // Uncomment the line below to auto-login on page load
            // login();
        });
    </script>
</body>
</html>
